[tool.poetry]
name = "devbutter-platform"
version = "0.1.0"
description = "DevButter platform backend: orchestrates accounts, AI-drafted and manual quotes, orders, and invoices across asaas_payment, butter_mind, and butter_relay."
authors = ["DevButter <hello@devbutter.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
pydantic = { extras = ["email"], version = "^2.9.0" }
pydantic-settings = "^2.5.0"
sqlalchemy = "^2.0.35"
greenlet = "^3.1.0"
alembic = "^1.13.0"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"
httpx = { extras = ["http2"], version = "^0.27.0" }
celery = { extras = ["redis"], version = "^5.4.0" }
bcrypt = "^4.2.0"
cryptography = "^43.0.0"
pyjwt = "^2.9.0"
python-socketio = "^5.16.4"
python-multipart = "^0.0.32"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
ruff = "^0.6.0"
aiosqlite = "^0.20.0"
respx = "^0.21.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# The project has a top-level `alembic/` dir, which makes isort mistake the
# installed `alembic` package for first-party code.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
