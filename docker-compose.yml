services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8002:8000"
    # All service DNS names, credentials, and secrets come from .env --
    # single source of truth, see that file for what resolves today vs. what
    # still needs a network entry added on the sibling repos' side.
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      # mTLS client cert for asaas_payment -- CN=devbutter-platform, signed
      #   by asaas_payment/certs/ca.{crt,key}
      # (copy into ./certs/; see .env's ASAAS_CLIENT_CERT_PATH comment)
      - ./certs:/app/certs:ro
    networks:
      default:
      devbutter_shared:
        aliases:
          - platform-api
    develop:
      watch:
        - path: ./app
          action: sync+restart
          target: /app/app
        - path: ./alembic
          action: sync+restart
          target: /app/alembic

networks:
  default:
  devbutter_shared:
    external: true
